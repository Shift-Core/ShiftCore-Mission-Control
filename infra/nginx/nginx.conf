# ShiftCore Nginx Gateway (R24-11)
# Owner: Mohamed Sameh (infrastructure)
# Only public browser entry point. Backend ports stay internal.
# Uses Docker Compose service names on the shiftcore-net network — never host IPs.

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ASP.NET Data Protection cookies (sc_token) are large (~1 KB encrypted payloads).
    # Without this, Nginx silently returns 400 when the Cookie header exceeds the
    # default 512-byte buffer on POST requests like /logout.
    large_client_header_buffers 4 16k;

    # Request ID for tracing
    map $request_id $req_id {
        default $request_id;
        ""      $request_id;
    }

    # -------------------------------------------------------------------------
    # Upstreams — Docker service names + internal ports (Compose network)
    # Do NOT use host IPs; they only work on one machine.
    # -------------------------------------------------------------------------
    upstream identity_service {
        server identity:5001;
    }

    upstream core_service {
        server core:4000;
    }

    upstream ai_service {
        server ai:8000;
    }

    upstream web_service {
        server web:3000;
    }

    server {
        listen 80;
        server_name _;

        # Standard forwarded headers (Architecture)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $req_id;

        # Cookies / Set-Cookie are forwarded without rewriting
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;

        # ---------------------------------------------------------------------
        # Health allowlist
        # ---------------------------------------------------------------------
        location = /health/frontend {
            access_log off;
            proxy_pass http://web_service/health;
        }

        location = /health/identity {
            access_log off;
            proxy_pass http://identity_service/health;
        }

        location = /health/core {
            access_log off;
            proxy_pass http://core_service/health;
        }

        location = /health/ai {
            access_log off;
            proxy_pass http://ai_service/health;
        }

        # ---------------------------------------------------------------------
        # API allowlist (versioned /v1)
        # Public prefixes are preserved when forwarded.
        # ---------------------------------------------------------------------
        location /api/identity/v1/ {
            proxy_pass http://identity_service;
            # Allow POST with no body (e.g. logout). nginx 400s a POST missing
            # Content-Length unless we explicitly use HTTP/1.1 keep-alive.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }


        location /api/core/v1/ {
            proxy_pass http://core_service;
        }

        location /api/ai/v1/ {
            proxy_pass http://ai_service;
        }

        # Private AI/Data documentation. The public query credential is moved
        # to an internal-only header and removed before proxying so it does not
        # appear in either Nginx or Uvicorn access logs.
        location = /api/docs {
            access_log off;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;
            proxy_set_header X-Request-Id            $req_id;
            proxy_set_header X-ShiftCore-Docs-Key    $arg_key;
            proxy_pass http://ai_service$uri;
        }

        location = /api/docs/openapi.yaml {
            access_log off;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;
            proxy_set_header X-Request-Id            $req_id;
            proxy_set_header X-ShiftCore-Docs-Key    $arg_key;
            proxy_pass http://ai_service$uri;
        }

        # ---------------------------------------------------------------------
        # Unknown /api/* → safe JSON 404 (not the React page)
        # ---------------------------------------------------------------------
        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Unknown API route","requestId":"$req_id"}}';
        }

        # ---------------------------------------------------------------------
        # Frontend SPA — non-API routes fall back to React
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://web_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
