worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream identity_service {
        server 192.168.1.50:5001;
    }

    upstream core_service {
        server 192.168.1.20:4000;
    }

    upstream ai_service {
        server 192.168.1.30:8000;
    }

    upstream web_service {
        server 192.168.1.40:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/identity/v1/ {
            proxy_pass http://identity_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/core/v1/ {
            proxy_pass http://core_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ai/v1/ {
            proxy_pass http://ai_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /health/core {
            proxy_pass http://core_service/health;
        }

        location = /health/ai {
            proxy_pass http://ai_service/health;
        }

        location = /health/identity {
            proxy_pass http://identity_service/health;
        }

        location = /health/frontend {
            proxy_pass http://web_service/health;
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"API route not found"}}';
        }
    }
}
