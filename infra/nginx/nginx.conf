# ShiftCore Nginx Gateway - Placeholder (R24-04)
# Owner: Mohamed Sameh (infrastructure)
# Final versioned routing, health forwarding, and unknown-route behavior
# are defined in Architecture and will be completed in a later task.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Authentication and authorization are NOT delegated to Nginx

    server {
        listen 80;
        server_name _;

        location /health/frontend {
            access_log off;
            return 200 'frontend-placeholder-ok';
            add_header Content-Type text/plain;
        }

        location / {
            return 200 'ShiftCore Gateway placeholder - routing not yet configured\n';
            add_header Content-Type text/plain;
        }

        # Future routes (Architecture):
        # /api/identity/v1/*  -> identity:5001
        # /api/core/v1/*      -> core:4000
        # /api/ai/v1/*        -> ai:8000
        # /health/core        -> core health
        # /health/identity    -> identity health
        # /health/ai          -> ai health
        # Unknown /api/*      -> shared JSON 404 envelope
        # Non-API routes      -> React SPA fallback
    }
}
