# =============================================================================
# ShiftCore Mission Control - Compose Contract (R24-04)
# Configuration validation only. Application Dockerfiles and business logic
# are owned by the respective service owners and are out of scope here.
# =============================================================================

name: shiftcore

networks:
  shiftcore-net:
    driver: bridge
    name: shiftcore-net

volumes:
  postgres_data:
    name: shiftcore_postgres_data
  identity_dpkeys:
    name: shiftcore_identity_dpkeys

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Infrastructure
  # Owner: Mohamed Sameh
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shiftcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiftcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftcore_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-shiftcore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap:/docker-entrypoint-initdb.d:ro
    networks:
      - shiftcore-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftcore} -d ${POSTGRES_DB:-shiftcore}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Identity Migrations (EF Core)
  # Owner: Mohamed Tawfik
  # Runs dotnet ef database update against postgres and exits (one-shot).
  # Identity API must not start until this service completes successfully.
  # ---------------------------------------------------------------------------
  identity-migrations:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      target: migrations
    container_name: shiftcore-identity-migrations
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-shiftcore};Username=${IDENTITY_DB_USER:-identity_app};Password=${IDENTITY_DB_PASSWORD:-identity_local_dev_only};Search Path=identity"
    networks:
      - shiftcore-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Identity Seeder
  # Owner: Mohamed Tawfik
  # Runs dotnet ef DatabaseSeeder and exits.
  # ---------------------------------------------------------------------------
  identity-seed:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      target: final
    container_name: shiftcore-identity-seed
    command: [ "dotnet", "IdentityApi.dll", "--seed" ]
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-shiftcore};Username=${IDENTITY_DB_USER:-identity_app};Password=${IDENTITY_DB_PASSWORD:-identity_local_dev_only};Search Path=identity"
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-local_dev_only_change_me}
    networks:
      - shiftcore-net
    depends_on:
      postgres:
        condition: service_healthy
      identity-migrations:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------------------
  # Identity API (ASP.NET Core)
  # Owner: Mohamed Tawfik
  # Path: services/identity
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      target: final
    container_name: shiftcore-identity
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-shiftcore};Username=${IDENTITY_DB_USER:-identity_app};Password=${IDENTITY_DB_PASSWORD:-identity_local_dev_only};Search Path=identity"
      Jwt__Issuer: ${JWT_ISSUER:-shiftcore-identity}
      Jwt__Audience: ${JWT_AUDIENCE:-shiftcore-api}
      Jwt__PrivateKeyPath: ${JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt_private}
      SC_TOKEN_COOKIE_NAME: ${SC_TOKEN_COOKIE_NAME:-sc_token}
    networks:
      - shiftcore-net
    expose:
      - "5001"
    volumes:
      - identity_dpkeys:/app/dataprotection-keys
    secrets:
      - jwt_private
    depends_on:
      postgres:
        condition: service_healthy
      identity-seed:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:5001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Core API (Express.js)
  # Owner: Abo El Ala
  # Path: services/core
  # ---------------------------------------------------------------------------
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: shiftcore-core
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: "postgresql://${CORE_DB_USER:-core_app}:${CORE_DB_PASSWORD:-core_local_dev_only}@postgres:5432/${POSTGRES_DB:-shiftcore}?schema=core"
      JWT_ISSUER: ${JWT_ISSUER:-shiftcore-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-shiftcore-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt_public}
    volumes:
      # Hot reload application code
      - ./services/core/src:/app/src

      # Allow Prisma schema changes without rebuilding
      - ./services/core/prisma:/app/prisma

      # Prisma config
      - ./services/core/prisma.config.ts:/app/prisma.config.ts

      # TypeScript config
      - ./services/core/tsconfig.json:/app/tsconfig.json
    networks:
      - shiftcore-net
    expose:
      - "4000"
    secrets:
      - jwt_public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # AI/Data API (FastAPI) - non-persisted deterministic preview
  # Owner: Peter
  # Path: services/ai
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: shiftcore-ai
    restart: unless-stopped
    environment:
      PYTHON_ENV: ${PYTHON_ENV:-development}
      PORT: 8000
      CORE_INTERNAL_URL: ${CORE_INTERNAL_URL:-http://core:4000}
      JWT_ISSUER: ${JWT_ISSUER:-shiftcore-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-shiftcore-api}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt_public}
      SC_TOKEN_COOKIE_NAME: ${SC_TOKEN_COOKIE_NAME:-sc_token}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
    networks:
      - shiftcore-net
    expose:
      - "8000"
    secrets:
      - jwt_public
    depends_on:
      - core
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # React Web Frontend
  # Path: apps/web
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shiftcore-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - shiftcore-net
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Nginx Gateway - only public browser entry point
  # Path: infra/nginx
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: shiftcore-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shiftcore-net
    depends_on:
      - web
      - identity
      - core
      - ai
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/frontend" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem
