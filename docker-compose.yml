name: shiftcore-mission-control

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: smc_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      - frontend
      - identity-api
      - core-api
      - ai-api
    networks:
      - smc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/frontend"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smc_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    networks:
      - smc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  identity-api:
    build:
      context: ./services/identity-api
      dockerfile: Dockerfile
    container_name: smc_identity_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${IDENTITY_DB_CONNECTION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/identity"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: smc_core_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${CORE_PORT:-3000}
      - DB_CONNECTION=${CORE_DB_CONNECTION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/core"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-api:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    container_name: smc_ai_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${AI_PORT:-8000}
      - AI_MODE=${AI_MODE:-deterministic}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ai"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - smc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: smc_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smc_network:
    name: smc_network
    driver: bridge

volumes:
  postgres_data:
