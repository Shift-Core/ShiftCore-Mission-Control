# R24-11 — Single minimal PR workflow
# Covers: config validation + Identity + Core + AI + Web
# Changed-area only. Full builds/tests stay with service owners.
# Keep minimal — no production deploy, no heavy matrices.

name: PR Minimal Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: pr-minimal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always run
  # ---------------------------------------------------------------------------
  config-validation:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose config --quiet
          echo "docker compose config: OK"

      - name: Check required paths exist
        run: |
          required=(
            apps/web
            services/identity
            services/core
            services/ai
            infra/nginx
            infra/postgres/bootstrap
            contracts
            scripts/init-local-env.sh
            .env.example
          )
          for p in "${required[@]}"; do
            if [ ! -e "$p" ]; then
              echo "Missing required path: $p"
              exit 1
            fi
          done
          echo "Required paths: OK"

      - name: Check init script contract
        run: |
          test -f scripts/init-local-env.sh
          # Must not require a real provider key
          if grep -qE '^[[:space:]]*AI_API_KEY=[^[:space:]#]+' .env.example 2>/dev/null; then
            echo "ERROR: .env.example must not contain a real AI_API_KEY value"
            exit 1
          fi
          echo "init-local-env contract: OK"

  # ---------------------------------------------------------------------------
  # Identity — Owner: Mohamed Tawfik
  # ---------------------------------------------------------------------------
  identity:
    name: Identity (changed-area)
    runs-on: ubuntu-latest
    needs: config-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          BASE="${{ github.base_ref || 'develop' }}"
          if git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null | grep -qE '^services/identity/|^docker-compose.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Identity contract paths
        if: steps.changes.outputs.run == 'true'
        run: |
          test -f services/identity/Dockerfile
          test -d services/identity
          echo "Identity contract paths: OK"
          # Real build/test owned by Mohamed Tawfik

      - name: Skip
        if: steps.changes.outputs.run != 'true'
        run: echo "No Identity changes — skipped"

